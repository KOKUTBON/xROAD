name: Bug Report
description: Create a report to help us reproduce and fix an issue.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do NOT report security vulnerabilities here; follow [SECURITY.md](https://github.com/KOKUTBON/xROAD/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Version / Commit SHA
      description: What version or git commit of the repository are you running?
      placeholder: "e.g. v1.0.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Run '...'
        2. Call endpoint '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Logs
      description: OS, Python version, Node.js version, container runtime, and relevant logs.
      render: shell
