name: Feature Request
description: Propose a new feature, adapter, model extension, or enhancement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues and discussions before submitting a new feature request.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or research need?
      placeholder: "A clear and concise description of what the problem is."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like the platform to do?
      placeholder: "Describe the proposed solution, API changes, or modeling approach."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, references, or screenshots about the feature request here.
