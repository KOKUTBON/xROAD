name: Model evaluation gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/road_risk_modeling/model_evaluation.py"
      - "src/road_risk_modeling/model_registry.py"
      - "config/evaluation-suites/**"
      - "tools/evaluate_registered_model.py"
      - "tests/test_model_evaluation.py"

permissions:
  contents: read

jobs:
  model-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[ml,dev]"
      - run: PYTHONPATH=src python -m pytest -q tests/test_model_evaluation.py tests/test_model_registry.py
