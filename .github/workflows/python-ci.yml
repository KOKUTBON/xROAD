name: Python CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[analytics,geospatial,ml,api,worker,dev]'

      - name: Check tracked file sizes
        run: python tools/check_tracked_file_sizes.py

      - name: Export OpenAPI contract
        run: python tools/export_openapi_contract.py --output-dir docs/api

      - name: Verify OpenAPI contract snapshot
        run: git diff --exit-code docs/api/openapi-v1.json docs/api/v1-route-contract.json

      - name: Upload OpenAPI contract artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: road-risk-openapi-v1
          path: |
            docs/api/openapi-v1.json
            docs/api/v1-route-contract.json

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify institutional onboarding demo
        run: python tools/institutional_onboarding_demo.py
