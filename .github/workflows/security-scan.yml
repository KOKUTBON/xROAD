name: Security Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install package and scan tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -e '.[api,worker,dev]'
          python -m pip install pip-audit bandit pip-licenses

      - name: Repository security release checks
        run: python tools/security_release_checks.py --summary

      - name: Python dependency audit
        run: pip-audit --progress-spinner off

      - name: Python SAST baseline
        run: bandit -q -r apps services src -x tests

      - name: Python license baseline
        run: pip-licenses --format=markdown --with-license-file --fail-on 'GPL;AGPL'

      - name: Web dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high --omit=dev
