name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "infra/docker/Dockerfile.web"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "infra/docker/Dockerfile.web"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Next.js shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      # Includes the WCAG A/AA axe gate (e2e/accessibility.spec.ts, #177).
      # The token-contrast gate runs above in `npm run test`
      # (lib/contrast.test.ts).
      - name: Run browser release + accessibility gates
        run: npm run e2e
