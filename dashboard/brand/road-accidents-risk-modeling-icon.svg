<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- model / analysis boundary -->
  <circle cx="512" cy="512" r="338"
          fill="none" stroke="#000000" stroke-width="54"/>

  <!-- road network -->
  <g stroke="#000000" stroke-width="150" stroke-linecap="round">
    <line x1="512" y1="210" x2="512" y2="814"/>
    <line x1="210" y1="512" x2="814" y2="512"/>
  </g>

  <!-- lane separators -->
  <g stroke="#ffffff" stroke-width="30" stroke-linecap="round">
    <line x1="512" y1="242" x2="512" y2="380"/>
    <line x1="512" y1="644" x2="512" y2="782"/>
    <line x1="242" y1="512" x2="380" y2="512"/>
    <line x1="644" y1="512" x2="782" y2="512"/>
  </g>

  <!-- central modeled risk node -->
  <circle cx="512" cy="512" r="104" fill="#000000"/>
  <circle cx="512" cy="512" r="37" fill="#ffffff"/>

  <!-- four compact data points around the road system -->
  <circle cx="335" cy="335" r="34" fill="#000000"/>
  <circle cx="689" cy="335" r="34" fill="#000000"/>
  <circle cx="335" cy="689" r="34" fill="#000000"/>
  <circle cx="689" cy="689" r="34" fill="#000000"/>
</svg>
