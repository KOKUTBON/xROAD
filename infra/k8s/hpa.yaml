apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: road-risk-api
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-api
    app.kubernetes.io/part-of: road-risk-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: road-risk-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: road-risk-worker
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-worker
    app.kubernetes.io/part-of: road-risk-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: road-risk-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: road-risk-web
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-web
    app.kubernetes.io/part-of: road-risk-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: road-risk-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
