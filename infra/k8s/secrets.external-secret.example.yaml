# External Secrets Operator example.
#
# Apply only after installing external-secrets and creating the referenced
# SecretStore or ClusterSecretStore. Remote key names are examples; align
# them to the municipal secret manager naming policy.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: road-risk-secrets
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-secrets
    app.kubernetes.io/part-of: road-risk-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: municipal-secret-store
    kind: ClusterSecretStore
  target:
    name: road-risk-secrets
    creationPolicy: Owner
  data:
    - secretKey: ROAD_RISK_DATABASE_URL
      remoteRef:
        key: /road-risk/staging/database-url
    - secretKey: ROAD_RISK_REDIS_URL
      remoteRef:
        key: /road-risk/staging/redis-url
    - secretKey: ROAD_RISK_WORKER_RESULT_BACKEND
      remoteRef:
        key: /road-risk/staging/redis-result-url
    - secretKey: ROAD_RISK_STORAGE_ACCESS_KEY_ID
      remoteRef:
        key: /road-risk/staging/storage-access-key-id
    - secretKey: ROAD_RISK_STORAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: /road-risk/staging/storage-secret-access-key
    - secretKey: ROAD_RISK_WEB_OIDC_CLIENT_SECRET
      remoteRef:
        key: /road-risk/staging/web-oidc-client-secret
