# Bitnami Sealed Secrets example.
#
# Generate the encryptedData values with kubeseal for the destination
# cluster and namespace. The placeholder values below are intentionally
# invalid so they cannot be accidentally deployed as live credentials.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: road-risk-secrets
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-secrets
    app.kubernetes.io/part-of: road-risk-platform
spec:
  encryptedData:
    ROAD_RISK_DATABASE_URL: AgREPLACE_WITH_KUBESEAL_OUTPUT
    ROAD_RISK_REDIS_URL: AgREPLACE_WITH_KUBESEAL_OUTPUT
    ROAD_RISK_WORKER_RESULT_BACKEND: AgREPLACE_WITH_KUBESEAL_OUTPUT
    ROAD_RISK_STORAGE_ACCESS_KEY_ID: AgREPLACE_WITH_KUBESEAL_OUTPUT
    ROAD_RISK_STORAGE_SECRET_ACCESS_KEY: AgREPLACE_WITH_KUBESEAL_OUTPUT
    ROAD_RISK_WEB_OIDC_CLIENT_SECRET: AgREPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: road-risk-secrets
      namespace: road-risk
      labels:
        app.kubernetes.io/name: road-risk-secrets
        app.kubernetes.io/part-of: road-risk-platform
    type: Opaque
