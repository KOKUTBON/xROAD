# Next.js frontend deployment.
#
# The web runtime serves the public dashboard and authenticated workspace.
# Server-side API proxy routes use ROAD_RISK_WEB_API_BASE_URL so browsers
# can call the same web origin while the web pod talks to the API service
# inside the cluster.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-risk-web
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: road-risk-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: road-risk-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: road-risk-web
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: road-risk-registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: road-risk/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: road-risk-config
            - secretRef:
                name: road-risk-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: road-risk-web
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-web
spec:
  selector:
    app.kubernetes.io/name: road-risk-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
