# Celery worker deployment.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-risk-worker
  namespace: road-risk
  labels:
    app.kubernetes.io/name: road-risk-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: road-risk-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: road-risk-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: road-risk-worker
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: road-risk-registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: road-risk/worker:dev
          imagePullPolicy: IfNotPresent
          args:
            - "celery"
            - "-A"
            - "services.workers.celery_app"
            - "worker"
            - "--loglevel=INFO"
            - "--queues=road_risk_default,road_risk_ingestion,road_risk_published_refresh,road_risk_reports"
          envFrom:
            - configMapRef:
                name: road-risk-config
            - secretRef:
                name: road-risk-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "celery -A services.workers.celery_app inspect ping -d celery@$HOSTNAME --timeout 10"
            initialDelaySeconds: 60
            periodSeconds: 60
      volumes:
        - name: tmp
          emptyDir: {}
